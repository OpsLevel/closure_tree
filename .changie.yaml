changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '* {{.Body}}'

kinds:
  - label: Breaking Changes
    auto: major
  - label: Features
    auto: minor
  - label: Bug Fixes
    auto: patch
  - label: Deprecations
    auto: minor
  - label: Documentation
    auto: patch
  - label: Dependency Updates
    auto: patch
  - label: Other Changes
    auto: patch

newlines:
  afterChangelogHeader: 1
  afterChangelogVersion: 1
  afterKind: 1
  afterChange: 0
  beforeKind: 1
  beforeChangelogVersion: 1
  endOfVersion: 1

footerFormat: |
  **Full Changelog**: https://github.com/ClosureTree/closure_tree/compare/{{.PreviousVersion}}...{{.Version}}

body: |
  What does this change do?
  
  
  Why was this change made?
  
  
  What are the side effects of this change (if any)?
  
  
  Does this change require documentation updates?
  
  
custom:
  - key: Author
    label: GitHub Username (e.g., @username)
    type: string
    minLength: 2
  - key: Issue
    label: GitHub Issue or PR (e.g., #123)
    type: string
    minLength: 1
